<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GraphQL</title>
  <script>
    // Single Page Apps for GitHub Pages
    // Decodes the path 404.html encoded and restores the real URL
    // via history.replaceState before the router ever inspects it.
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    }(window.location));
  </script>
  <link rel="preload" href="style/global.css" as="style" />
  <link rel="stylesheet" href="style/global.css" />
</head>
<body>
  <div id="app"></div>

  <script type="module" src="utils/router.js"></script>
</body>
</html>
