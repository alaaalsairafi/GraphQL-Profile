<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GraphQL</title>
  <link rel="preload" href="style/global.css" as="style" />
  <link rel="stylesheet" href="style/global.css" />
  <script>
    // Single Page Apps for GitHub Pages
    // Runs AFTER the stylesheet <link> above has already resolved against
    // the original URL, so rewriting the address bar here is now safe.
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        decoded = decoded.replace(/\/+$/, '') || '/'; // strip stray trailing slash
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    }(window.location));
  </script>
</head>
<body>
  <div id="app"></div>

  <script type="module" src="utils/router.js"></script>
</body>
</html>
