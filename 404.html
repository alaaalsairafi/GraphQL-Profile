<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    // Single Page Apps for GitHub Pages
    // Encodes the real path GitHub couldn't find into a query string,
    // then bounces to index.html so the SPA can decode and restore it.
    var l = window.location;
    var path = l.pathname.slice(1).split('/').slice(1).join('/').replace(/\/+$/, '');
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      '/GraphQL-Profile/?/' + path.replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
